name: Validate Kubernetes Manifests

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  validate-manifests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y yamllint

          curl -sSL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz \
            | tar -xz
          sudo mv kubeconform /usr/local/bin/

          curl -sSL https://github.com/open-policy-agent/conftest/releases/latest/download/conftest_Linux_x86_64.tar.gz \
            | tar -xz
          sudo mv conftest /usr/local/bin/

      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -U pip
          .venv/bin/pip install -r requirements.txt

      - name: Make manifest check script executable
        run: chmod +x tests/check-manifests.sh

      - name: Gate duplicate challenge faults
        run: .venv/bin/python tests/test_generate_challenge.py

      - name: Run manifest validation
        run: tests/check-manifests.sh
